[package]
name = "opengrowth"
description = "Growth calculations for children: SDS and centiles against paediatric growth references, as a library, CLI, and HTTP API"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Open Health Technology Foundation contributors"]
repository = "https://github.com/ohtf/opengrowth"
homepage = "https://github.com/ohtf/opengrowth"
# Not published while the embedded UK90 tables await a UKRI licence (spec/queries.md Q1).
publish = false

[features]
default = ["cli", "embedded-data"]
# Reference tables compiled into the binary (data/). Without it, tables are
# imported at run time with `opengrowth data import`.
embedded-data = []
# The HTTP API (`opengrowth serve`).
server = ["dep:axum", "dep:tokio"]
# The `opengrowth` and `og` binaries. Includes the server, which `serve` runs.
cli = ["server", "dep:anyhow", "dep:clap", "dep:clap_complete"]

[[bin]]
name = "opengrowth"
path = "src/main.rs"
required-features = ["cli"]

# Short alias: the same program, built from the same entry point.
[[bin]]
name = "og"
path = "src/bin/og.rs"
required-features = ["cli"]

[[example]]
name = "round0"
required-features = ["embedded-data"]

[dependencies]
# The engine: always present, and all that `default-features = false` brings in.
jiff = { version = "1.0.0", default-features = false, features = ["std"] }
libm = "0.2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"

# Surfaces.
anyhow = { version = "1.0.104", optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"], optional = true }
clap = { version = "4.6.8", features = ["derive", "env", "wrap_help"], optional = true }
clap_complete = { version = "4.6.12", optional = true }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"], optional = true }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
