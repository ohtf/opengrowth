[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Open Health Technology Foundation contributors"]
repository = "https://github.com/ohtf/opengrowth"
homepage = "https://github.com/ohtf/opengrowth"

[workspace.dependencies]
opengrowth-core = { path = "crates/opengrowth-core", version = "0.1.0" }
opengrowth-data = { path = "crates/opengrowth-data", version = "0.1.0" }
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.12"
jiff = { version = "1.0.0", default-features = false, features = ["std"] }
libm = "0.2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
