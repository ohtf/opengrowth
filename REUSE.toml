version = 1

[[annotations]]
path = ["**/*.md", "LICENSE"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Open Health Technology Foundation contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [".gitignore", ".editorconfig", "Cargo.lock", "conformance/expected/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Open Health Technology Foundation contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Independent R vectors, copied unmodified from rcpchgrowth's AGPL-licensed
# test suite. See conformance/README.md for provenance.
[[annotations]]
path = "conformance/independent/uk-who-cole-r-vectors.json"
precedence = "override"
SPDX-FileCopyrightText = "Royal College of Paediatrics and Child Health"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# QMS issue templates and labels, adapted from the RCPCH Digital Growth Charts
# QMS (rcpch/digital-growth-charts-documentation, CC BY-SA 4.0).
[[annotations]]
path = [".github/ISSUE_TEMPLATE/**", ".github/labels.yml"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Open Health Technology Foundation contributors", "Royal College of Paediatrics and Child Health"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Embedded reference tables, copied unmodified from rcpchgrowth 4.6.5.
# Their own terms apply, not the code licence. See NOTICE.md and Q1.
[[annotations]]
path = ["data/uk90_preterm.json", "data/uk90_child.json"]
precedence = "override"
SPDX-FileCopyrightText = ["Medical Research Council, now UK Research and Innovation", "Royal College of Paediatrics and Child Health"]
SPDX-License-Identifier = "LicenseRef-UK90"

[[annotations]]
path = "data/who/who_2007_children.json"
precedence = "override"
SPDX-FileCopyrightText = ["World Health Organization", "Royal College of Paediatrics and Child Health"]
SPDX-License-Identifier = "LicenseRef-WHO-Growth-Reference-2007"

[[annotations]]
path = ["data/who/who_infants.json", "data/who/who_children.json"]
precedence = "override"
SPDX-FileCopyrightText = ["World Health Organization", "Royal College of Paediatrics and Child Health"]
SPDX-License-Identifier = "LicenseRef-WHO-Child-Growth-Standards"

