#
# Keeps the images pinned by digest current, so that they pick up their
# security fixes: the Dockerfile's base images, which CI builds and checks,
# and Caddy on the demo server (deploy/compose.yaml).
version: 2

updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      base-images:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      demo-server-images:
        applies-to: version-updates
        patterns:
          - "*"
