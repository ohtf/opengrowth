#
# The opengrowth demo server (R58): Caddy, for TLS and the /growth/v1 prefix,
# in front of opengrowth. s/deploy copies this directory to the server and
# writes .env beside it, so that the stack runs the image built from the
# commit being deployed. Every image is pinned: opengrowth by its commit, and
# Caddy by digest, which Dependabot keeps current.
name: opengrowth

services:
  opengrowth:
    image: opengrowth:${OPENGROWTH_COMMIT:?OPENGROWTH_COMMIT must be set in .env; s/deploy writes it}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: local
    networks: [internal]

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on: [opengrowth]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-api.openhealthtechnology.org}
    labels:
      # The Caddyfile's hash, from s/deploy. Compose cannot see a change to a
      # mounted file, but it restarts Caddy when this label changes.
      org.openhealthtechnology.caddyfile-sha256: ${CADDYFILE_SHA256:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
    networks: [internal]

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
