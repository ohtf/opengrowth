#
# The opengrowth demo server (R58): Caddy, for TLS, in front of APISIX, for
# routing and rate limits, in front of opengrowth. s/deploy copies this
# directory to the server and writes .env beside it, so that the stack runs
# the image built from the commit being deployed. Every image is pinned:
# opengrowth by its commit, and Caddy and APISIX by digest, which Dependabot
# keeps current.
name: opengrowth

services:
  opengrowth:
    image: opengrowth:${OPENGROWTH_COMMIT:?OPENGROWTH_COMMIT must be set in .env; s/deploy writes it}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: local
    networks: [internal]

  apisix:
    image: apache/apisix:3.21.0-debian@sha256:1741a8e1186e5c39ea10e6b4fb3e682534d1705efb8328195de5b41ad0657380
    restart: unless-stopped
    depends_on: [opengrowth]
    # Not read-only: APISIX writes its nginx.conf when it starts.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      APISIX_STAND_ALONE: "true"
    labels:
      # The hash of APISIX's two files, from s/deploy, so that a change to
      # either restarts APISIX with it.
      org.openhealthtechnology.apisix-config-sha256: ${APISIX_CONFIG_SHA256:-}
    volumes:
      - ./apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix-routes.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: local
    networks: [internal]

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on: [apisix]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-api.openhealthtechnology.org}
    labels:
      # The Caddyfile's hash, from s/deploy. Compose cannot see a change to a
      # mounted file, but it restarts Caddy when this label changes.
      org.openhealthtechnology.caddyfile-sha256: ${CADDYFILE_SHA256:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
    networks: [internal]

networks:
  internal:
    # With IPv6 here, Docker forwards IPv6 clients' connections with their
    # own addresses, as it does IPv4 clients', instead of through a proxy
    # process that would give them all one address, and so one rate limit.
    enable_ipv6: true

volumes:
  caddy_data:
  caddy_config:
